[build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile"
context = "backend"

[deploy]
startCommand = "python manage.py migrate && gunicorn fisilti.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
healthcheckPath = "/health/"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
