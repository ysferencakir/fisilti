services:
  db:
    image: postgres:16
    env_file: ./backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-fisilti}
      POSTGRES_USER: ${DB_USER:-fisilti_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fisilti_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fisilti_user}"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
