<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 - Sunucu Hatası | Fısıltı</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #FEE2E2 0%, #FECACA 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            text-align: center;
        }

        .emoji-large {
            font-size: 120px;
            margin-bottom: 20px;
            animation: shake 0.5s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        h1 {
            font-size: 48px;
            font-weight: 800;
            color: #7F1D1D;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 18px;
            color: #B45454;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .description {
            font-size: 15px;
            color: #D17A7A;
            margin-bottom: 40px;
            line-height: 1.8;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        a, button {
            padding: 12px 28px;
            border-radius: 9999px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: #EF4444;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: #DC2626;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(239, 68, 68, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #7F1D1D;
            border: 1px solid #FCA5A5;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            background: #FEF2F2;
            border-color: #F87171;
            transform: translateY(-2px);
        }

        .error-code {
            display: inline-block;
            background: rgba(239, 68, 68, 0.1);
            color: #EF4444;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .illustration {
            margin: 40px 0;
            font-size: 12px;
            color: #FBCACB;
            font-weight: 500;
            letter-spacing: 2px;
        }

        @media (max-width: 640px) {
            .emoji-large {
                font-size: 80px;
                margin-bottom: 15px;
            }

            h1 {
                font-size: 36px;
            }

            .subtitle {
                font-size: 16px;
            }

            .button-group {
                flex-direction: column;
            }

            a, button {
                width: 100%;
                justify-content: center;
            }
        }

        .divider {
            width: 60px;
            height: 3px;
            background: #EF4444;
            border-radius: 9999px;
            margin: 0 auto 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji-large">⚠️</div>

        <div class="error-code">500 HATA</div>

        <h1>Sunucu Hatası</h1>

        <div class="divider"></div>

        <p class="subtitle">Bir şeyler yanlış gitti!</p>

        <p class="description">
            Sunucumuzda beklenmeyen bir hata oluştu. Lütfen daha sonra tekrar deneyin veya destek ekibimizle iletişime geç.
        </p>

        <div class="illustration">
            ⚡ ⚡ ⚡
        </div>

        <div class="button-group">
            <a href="/" class="btn-primary">
                <span>🏠</span> Ana Sayfaya Dön
            </a>
            <button class="btn-secondary" onclick="location.reload()">
                <span>🔄</span> Yenile
            </button>
        </div>

        <p style="margin-top: 50px; font-size: 13px; color: #D17A7A;">
            Sorunun devam ederse, <a href="/" style="color: #EF4444; text-decoration: none;">destek</a> ile iletişime geç.
        </p>
    </div>
</body>
</html>
