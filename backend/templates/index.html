<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fennec.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fısıltı - Fikirlerini paylaş, deneyimlerini öğren" />
    <meta name="theme-color" content="#F97316" />
    <title>Fısıltı - Mikro Blog Platformu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #FFF7ED;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        // Load React app from built frontend
        fetch('/static/index.html')
            .then(r => r.text())
            .then(html => {
                // Extract script and link tags, load dynamically
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                // Copy head elements
                Array.from(doc.head.children).forEach(el => {
                    if (el.tagName === 'LINK' || el.tagName === 'SCRIPT' || el.tagName === 'META') {
                        document.head.appendChild(el.cloneNode(true));
                    }
                });

                // Copy body content
                document.getElementById('root').innerHTML = doc.getElementById('root')?.innerHTML || '';
            })
            .catch(err => {
                document.body.innerHTML = `
                    <div style="padding: 40px; text-align: center; color: #666;">
                        <h1>Uygulama Yükleniyor...</h1>
                        <p>Lütfen sayfayı yenileyin.</p>
                    </div>
                `;
            });
    </script>
</body>
</html>
