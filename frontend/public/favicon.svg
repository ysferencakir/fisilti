<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background -->
  <rect width="256" height="256" fill="#FFF7ED" rx="60"/>

  <!-- Outer ears -->
  <path d="M 80 70 Q 70 50 50 45 Q 40 43 35 55 Q 33 62 45 75 Q 65 75 80 70" fill="#F97316"/>
  <path d="M 176 70 Q 186 50 206 45 Q 216 43 221 55 Q 223 62 211 75 Q 191 75 176 70" fill="#F97316"/>

  <!-- Inner ear details -->
  <path d="M 75 75 Q 68 60 55 60 Q 50 60 48 68 Q 50 75 65 78" fill="#FDE8D0"/>
  <path d="M 181 75 Q 188 60 201 60 Q 206 60 208 68 Q 206 75 191 78" fill="#FDE8D0"/>

  <!-- Head -->
  <circle cx="128" cy="140" r="75" fill="#F97316"/>

  <!-- Face base -->
  <ellipse cx="128" cy="145" rx="65" ry="70" fill="#FDE8D0"/>

  <!-- Eyes -->
  <circle cx="105" cy="120" r="8" fill="#1C1917"/>
  <circle cx="151" cy="120" r="8" fill="#1C1917"/>

  <!-- Eye shine -->
  <circle cx="106" cy="118" r="3" fill="white"/>
  <circle cx="152" cy="118" r="3" fill="white"/>

  <!-- Snout/Nose area -->
  <ellipse cx="128" cy="155" rx="22" ry="18" fill="white"/>

  <!-- Nose -->
  <ellipse cx="128" cy="150" rx="7" ry="6" fill="#F97316"/>

  <!-- Mouth -->
  <path d="M 128 150 Q 120 160 115 158" stroke="#1C1917" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 128 150 Q 136 160 141 158" stroke="#1C1917" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="85" y1="140" x2="65" y2="135" stroke="#1C1917" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="85" y1="150" x2="65" y2="155" stroke="#1C1917" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="171" y1="140" x2="191" y2="135" stroke="#1C1917" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="171" y1="150" x2="191" y2="155" stroke="#1C1917" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cheeks -->
  <circle cx="75" cy="145" r="6" fill="#F97316" opacity="0.3"/>
  <circle cx="181" cy="145" r="6" fill="#F97316" opacity="0.3"/>
</svg>
